<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1419">
  <title>车库门</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<p data-aigc-mark="1" style="margin:0 0 8px;font-size:10px;line-height:1.3;color:#6b6560;font-weight:400;">AI生成</p>

  <div class="wrap">
    <header>
      <h1>车库门</h1>
      <p class="sub" id="statusText">未登录</p>
    </header>

    <section id="loginView" class="card">
      <label for="pw">访问密码</label>
      <input id="pw" type="password" inputmode="text" autocomplete="current-password" placeholder="输入密码">
      <button id="loginBtn" class="btn primary" type="button">进入</button>
      <p class="tip">仅限本人使用。密码错误不会开门。</p>
    </section>

    <section id="ctrlView" class="card hidden">
      <div class="btns">
        <button id="openBtn" class="btn open" type="button">开门</button>
        <button id="closeBtn" class="btn close" type="button">关门</button>
      </div>
      <p class="tip" id="resultText">点按钮后设备会轮询取令并执行</p>
      <button id="logoutBtn" class="btn sec" type="button">退出</button>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
