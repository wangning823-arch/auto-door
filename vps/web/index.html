<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>车库门控制台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="logo"></span>
        <div>
          <h1>车库门控制台</h1>
          <p class="sub" id="statusText">未登录</p>
        </div>
      </div>
      <button id="logoutBtn" class="btn ghost hidden" type="button">退出</button>
    </header>

    <section id="loginView" class="card login-card">
      <h2>登录</h2>
      <p class="muted">查看设备状态、日志，在线升级固件</p>
      <label for="pw">访问密码</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="输入密码">
      <button id="loginBtn" class="btn primary" type="button">进入</button>
      <p class="tip" id="loginTip"></p>
    </section>

    <section id="listView" class="hidden">
      <div class="toolbar">
        <h2>设备</h2>
        <div class="toolbar-actions">
          <button id="refreshBtn" class="btn ghost sm" type="button">刷新</button>
          <button id="otaBtn" class="btn primary sm" type="button">上传固件</button>
        </div>
      </div>
      <div id="otaBar" class="card ota-card hidden">
        <h3>在线 OTA</h3>
        <p class="muted">上传 <code>firmware.bin</code> 只写入服务器；设备<strong>不会</strong>自动升级，需在设备页点「立即更新」</p>
        <div class="ota-row">
          <input id="verInput" type="text" placeholder="版本号（可选，如 0.2.202609241200）">
          <input id="binInput" type="file" accept=".bin">
        </div>
        <div class="btn-row">
          <button id="uploadBtn" class="btn primary sm" type="button">上传固件</button>
          <span id="otaMsg" class="tip"></span>
        </div>
        <p class="muted" id="otaCurrent"></p>
      </div>
      <div id="deviceList" class="device-list"></div>
      <p class="tip" id="listTip"></p>
    </section>

    <section id="detailView" class="hidden">
      <div class="toolbar">
        <button id="backBtn" class="btn ghost sm" type="button">← 返回</button>
        <h2 id="devTitle">设备</h2>
        <div class="toolbar-actions">
          <button id="dRefreshBtn" class="btn ghost sm" type="button">刷新</button>
        </div>
      </div>

      <div class="detail-grid">
        <div class="card">
          <div class="head-row">
            <h3>运行状态</h3>
            <span id="devOnline" class="pill">—</span>
          </div>
          <div id="statusGrid" class="status-grid"></div>
          <div class="meta" id="devMeta"></div>
        </div>

        <div class="card">
          <h3>控制</h3>
          <div class="btns">
            <button id="openBtn" class="btn open" type="button">开门</button>
            <button id="closeBtn" class="btn close" type="button">关门</button>
          </div>
          <div class="btn-row">
            <button id="updateBtn" class="btn sec" type="button">立即更新</button>
          </div>
          <p class="tip" id="ctrlTip">指令 8 秒内由设备轮询领取；「立即更新」是唯一升级触发</p>
        </div>

        <div class="card" id="cfgCard">
          <div class="head-row">
            <h3>设备配置</h3>
            <span class="tip" id="cfgTip"></span>
          </div>

          <div class="cfg-group">
            <label for="cfgMac">车机蓝牙 MAC</label>
            <div class="cfg-row">
              <input id="cfgMac" type="text" placeholder="AA:BB:CC:DD:EE:FF" maxlength="17">
              <button id="cfgMacBtn" class="btn sec sm" type="button">保存</button>
            </div>
          </div>

          <div class="cfg-group">
            <label for="cfgMode">跟踪模式（保存后设备约 1.2 秒自动重启）</label>
            <div class="cfg-row">
              <select id="cfgMode">
                <option value="1">经典蓝牙（车机 MAC 跟踪）</option>
                <option value="0">BLE（配对手机 IRK 跟踪）</option>
              </select>
              <button id="cfgModeBtn" class="btn sec sm" type="button">保存</button>
            </div>
          </div>

          <div class="cfg-group">
            <label>经典自动跟踪（周期 Inquiry，仅经典模式）</label>
            <div class="cfg-row">
              <button id="cfgAutoOn" class="btn sec sm" type="button">开</button>
              <button id="cfgAutoOff" class="btn sec sm" type="button">关</button>
            </div>
          </div>

          <div class="cfg-group">
            <label>手机配对（仅 BLE 模式）</label>
            <div class="cfg-row">
              <button id="cfgPairOn" class="btn sec sm" type="button">打开 90 秒</button>
              <button id="cfgPairOff" class="btn sec sm" type="button">关闭配对</button>
            </div>
            <div class="cfg-row">
              <input id="cfgPin" type="password" placeholder="6位PIN（留空=清除）" maxlength="6">
              <button id="cfgPinBtn" class="btn sec sm" type="button">保存 PIN</button>
            </div>
          </div>

          <div class="cfg-group">
            <label>家庭 Wi‑Fi（经指令通道下发，仅用于设备联网/OTA）</label>
            <div class="cfg-row">
              <input id="cfgSsid" type="text" placeholder="SSID" maxlength="32">
              <input id="cfgPass" type="password" placeholder="密码（同SSID留空=不改）" maxlength="64">
            </div>
            <div class="cfg-row">
              <button id="cfgWifiBtn" class="btn sec sm" type="button">保存并连接</button>
            </div>
          </div>

          <div class="cfg-group">
            <label>维护</label>
            <div class="cfg-row">
              <button id="cfgNfcBtn" class="btn sec sm" type="button">重新初始化 NFC</button>
              <button id="cfgWebOff" class="btn sec sm" type="button">关闭本地网页</button>
              <button id="cfgWebOn" class="btn sec sm" type="button">开启本地网页</button>
            </div>
          </div>

          <p class="tip">配置经 VPS 指令队列下发，设备约 3 秒轮询领取；本地网页关闭后 80 端口不再监听，远程/日志/OTA 不受影响。</p>
        </div>

        <div class="card log-card">
          <div class="head-row">
            <h3>设备日志</h3>
            <div class="toolbar-actions">
              <button id="logRefreshBtn" class="btn ghost sm" type="button">刷新</button>
              <button id="logClearBtn" class="btn ghost sm" type="button">清除</button>
            </div>
          </div>
          <p class="meta" id="logMeta"></p>
          <pre id="logBox" class="log-box">加载中…</pre>
          <p class="tip" id="logClearTip"></p>
        </div>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
