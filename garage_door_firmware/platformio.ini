; 车库门智能控制器 P0
; ESP32 Dev Module / WROOM32, COM3 (CP2102)
; 使用经典蓝牙(BluetoothSerial)搜索手机/车机 + WiFi SoftAP + STA OTA
;
; 串口烧录（去车库插 USB）:  pio run -e esp32dev -t upload
; 无线烧录（书房，先在网页配好家庭 Wi‑Fi 且 STA 已连）:
;   pio run -e esp32dev_ota -t upload
;   upload_port 填 STA IP（网页首页 / 串口 wifi status；已去 mDNS，不再用 .local）

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = COM3
monitor_port = COM3
; 双 OTA 分区：在线升级要写到「非当前运行」的 app 槽
; 旧 huge_app.csv 只有单 app 分区，Update.begin 必失败 → 能下载不能升级
board_build.partitions = partitions_dual_ota.csv

; 编译前生成 src/fw_version.h（0.2.源码最新时间戳）
extra_scripts = pre:tools/bump_version.py

; 体积约束：双 OTA 槽 0x1F0000，需为功能增长留余量
; -flto / 无异常展开表 / 关 core 调试：功能不变的 flash 瘦身
; 平台 LINKFLAGS 自带 -fno-lto，必须 unflag 才能真正 LTO 链接
build_unflags = -fno-lto
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DBOARD_HAS_PSRAM=0
  -flto
  -fno-exceptions
  -fno-rtti
  -fno-asynchronous-unwind-tables

lib_deps =
  ; PN532 用 lib/Adafruit_PN532（含 readResponse 补丁，官方 1.3.4 无此 API）
  adafruit/Adafruit BusIO@^1.16.1

; 框架 ESPmDNS 由 lib/ESPmDNS 空实现顶替（ArduinoOTA 仍 #include，但不链 libmdns）

monitor_filters = esp32_exception_decoder, time

; 无线 OTA：依赖设备已在局域网且 ArduinoOTA 已 begin；用 STA IP，无 mDNS
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
; 改成你的实际 STA IP（网页首页 / 串口 wifi status）
upload_port = 192.168.1.100
upload_flags =
  --timeout=20
monitor_port =

; 测试板：id 带 -lab，避免和主门抢指令
[env:esp32dev_lab]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -DDEVICE_ROLE=\"lab\"
