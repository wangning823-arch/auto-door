<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#4a5568" stroke-width="1"/>
    </marker>
  </defs>
  <rect width="680" height="420" fill="#f7f8fa"/>
  <text x="340" y="28" text-anchor="middle" font-size="14" font-weight="500" fill="#1a202c">ESP32 ↔ 继电器模块 接线（固件默认）</text>

  <!-- ESP32 box -->
  <rect x="48" y="60" width="200" height="280" rx="8" fill="#fff" stroke="#cbd5e0" stroke-width="0.5"/>
  <text x="148" y="88" text-anchor="middle" font-size="13" font-weight="500" fill="#1a202c">ESP32 DevKit</text>
  <text x="148" y="108" text-anchor="middle" font-size="11" fill="#718096">USB 供电 / COM3</text>

  <!-- pins ESP -->
  <circle cx="248" cy="150" r="4" fill="#e53e3e"/>
  <text x="236" y="154" text-anchor="end" font-size="12" fill="#1a202c">5V (VIN)</text>
  <circle cx="248" cy="190" r="4" fill="#2d3748"/>
  <text x="236" y="194" text-anchor="end" font-size="12" fill="#1a202c">GND</text>
  <circle cx="248" cy="230" r="4" fill="#3182ce"/>
  <text x="236" y="234" text-anchor="end" font-size="12" fill="#1a202c">GPIO 26</text>
  <text x="148" y="300" text-anchor="middle" font-size="11" fill="#718096">IO26 = 固件 PIN_RELAY</text>
  <text x="148" y="318" text-anchor="middle" font-size="11" fill="#718096">高电平 1 秒 = 触发一次</text>

  <!-- Relay box -->
  <rect x="320" y="60" width="200" height="280" rx="8" fill="#fff" stroke="#cbd5e0" stroke-width="0.5"/>
  <text x="420" y="88" text-anchor="middle" font-size="13" font-weight="500" fill="#1a202c">5V 单路继电器模块</text>
  <text x="420" y="108" text-anchor="middle" font-size="11" fill="#718096">光耦隔离型即可</text>

  <rect x="340" y="130" width="160" height="36" rx="6" fill="#ebf8ff" stroke="#90cdf4" stroke-width="0.5"/>
  <text x="420" y="153" text-anchor="middle" font-size="12" fill="#2c5282">VCC</text>
  <rect x="340" y="170" width="160" height="36" rx="6" fill="#f7fafc" stroke="#a0aec0" stroke-width="0.5"/>
  <text x="420" y="193" text-anchor="middle" font-size="12" fill="#2d3748">GND</text>
  <rect x="340" y="210" width="160" height="36" rx="6" fill="#ebf8ff" stroke="#63b3ed" stroke-width="0.5"/>
  <text x="420" y="233" text-anchor="middle" font-size="12" fill="#2c5282">IN（信号）</text>

  <!-- wires ESP to relay -->
  <line x1="252" y1="150" x2="338" y2="148" stroke="#e53e3e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="252" y1="190" x2="338" y2="188" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="252" y1="230" x2="338" y2="228" stroke="#3182ce" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- output terminals -->
  <rect x="340" y="260" width="70" height="32" rx="6" fill="#fff5f5" stroke="#fc8181" stroke-width="0.5"/>
  <text x="375" y="281" text-anchor="middle" font-size="12" fill="#c53030">NO</text>
  <rect x="430" y="260" width="70" height="32" rx="6" fill="#f0fff4" stroke="#9ae6b4" stroke-width="0.5"/>
  <text x="465" y="281" text-anchor="middle" font-size="12" fill="#276749">COM</text>

  <text x="420" y="320" text-anchor="middle" font-size="11" fill="#718096">NO / COM 接到门控</text>

  <!-- garage target -->
  <rect x="540" y="160" width="110" height="100" rx="8" fill="#fffff0" stroke="#ecc94b" stroke-width="0.5"/>
  <text x="595" y="190" text-anchor="middle" font-size="12" font-weight="500" fill="#744210">备用遥控</text>
  <text x="595" y="210" text-anchor="middle" font-size="11" fill="#744210">按键两焊盘</text>
  <text x="595" y="230" text-anchor="middle" font-size="11" fill="#744210">或墙控端子</text>

  <line x1="405" y1="292" x2="540" y2="210" stroke="#c05621" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arr)"/>
  <line x1="495" y1="292" x2="560" y2="220" stroke="#276749" stroke-width="1.5" stroke-dasharray="4 2"/>

  <text x="340" y="380" text-anchor="middle" font-size="11" fill="#4a5568">注意：继电器线圈用 5V；若模块是 3.3V 触发，IN 仍可接 GPIO26</text>
  <text x="340" y="398" text-anchor="middle" font-size="11" fill="#4a5568">共地：ESP32 GND 必须与继电器模块 GND 相连</text>
</svg>
