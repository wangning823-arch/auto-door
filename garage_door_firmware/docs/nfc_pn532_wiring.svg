<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 490" width="680" height="490">
  <style>
    text { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  </style>

  <!-- 标题 -->
  <text x="340" y="28" text-anchor="middle" font-size="14" font-weight="500" fill="#e7ecf1">PN532 NFC ↔ ESP32 接线（I2C 模式 · 6 线）</text>
  <text x="340" y="48" text-anchor="middle" font-size="11" fill="#8b9aab">模块焊盘确认拨到 I2C · VCC 接 3.3V（勿接 5V）· IRQ/RST 必须接出</text>

  <!-- ESP32 -->
  <rect x="40" y="80" width="200" height="320" rx="8" fill="#1a2332" stroke="#2e3d52" stroke-width="1"/>
  <text x="140" y="110" text-anchor="middle" font-size="14" font-weight="500" fill="#2f80ed">ESP32 DevKit</text>
  <line x1="55" y1="125" x2="225" y2="125" stroke="#2e3d52" stroke-width="0.5"/>

  <!-- ESP32 引脚标签 -->
  <text x="70" y="160" font-size="12" fill="#e7ecf1">3.3V</text>
  <circle cx="220" cy="156" r="4" fill="#3dd68c"/>
  <text x="70" y="200" font-size="12" fill="#e7ecf1">GND</text>
  <circle cx="220" cy="196" r="4" fill="#8b9aab"/>
  <text x="70" y="240" font-size="12" fill="#e7ecf1">GPIO16 (SDA)</text>
  <circle cx="220" cy="236" r="4" fill="#2f80ed"/>
  <text x="70" y="280" font-size="12" fill="#e7ecf1">GPIO17 (SCL)</text>
  <circle cx="220" cy="276" r="4" fill="#f2c94c"/>
  <text x="70" y="320" font-size="12" fill="#e7ecf1">GPIO4 (IRQ)</text>
  <circle cx="220" cy="316" r="4" fill="#e67e22"/>
  <text x="70" y="360" font-size="12" fill="#e7ecf1">GPIO32 (RST)</text>
  <circle cx="220" cy="356" r="4" fill="#e74c3c"/>
  <text x="70" y="392" font-size="11" fill="#6b7c8f">GPIO21 已被继电器占用</text>

  <!-- PN532 -->
  <rect x="440" y="80" width="200" height="320" rx="8" fill="#1a2332" stroke="#2e3d52" stroke-width="1"/>
  <text x="540" y="110" text-anchor="middle" font-size="14" font-weight="500" fill="#e74c3c">PN532 NFC</text>
  <text x="540" y="130" text-anchor="middle" font-size="11" fill="#8b9aab">焊盘拨到 I2C</text>
  <line x1="455" y1="145" x2="625" y2="145" stroke="#2e3d52" stroke-width="0.5"/>

  <!-- PN532 引脚标签 -->
  <text x="470" y="160" font-size="12" fill="#e7ecf1">VCC</text>
  <circle cx="460" cy="156" r="4" fill="#3dd68c"/>
  <text x="470" y="200" font-size="12" fill="#e7ecf1">GND</text>
  <circle cx="460" cy="196" r="4" fill="#8b9aab"/>
  <text x="470" y="240" font-size="12" fill="#e7ecf1">SDA</text>
  <circle cx="460" cy="236" r="4" fill="#2f80ed"/>
  <text x="470" y="280" font-size="12" fill="#e7ecf1">SCL</text>
  <circle cx="460" cy="276" r="4" fill="#f2c94c"/>
  <text x="470" y="320" font-size="12" fill="#e7ecf1">IRQ</text>
  <circle cx="460" cy="316" r="4" fill="#e67e22"/>
  <text x="470" y="360" font-size="12" fill="#e7ecf1">RST (RSTPD_N)</text>
  <circle cx="460" cy="356" r="4" fill="#e74c3c"/>
  <text x="470" y="392" font-size="11" fill="#6b7c8f">SCL=0 卡死靠 RST 硬复位</text>

  <!-- 连线 VCC -->
  <path d="M 220 156 L 460 156" fill="none" stroke="#3dd68c" stroke-width="1.5"/>
  <text x="340" y="148" text-anchor="middle" font-size="10" fill="#3dd68c">3.3V</text>

  <!-- 连线 GND -->
  <path d="M 220 196 L 460 196" fill="none" stroke="#8b9aab" stroke-width="1.5"/>
  <text x="340" y="188" text-anchor="middle" font-size="10" fill="#8b9aab">GND</text>

  <!-- 连线 SDA -->
  <path d="M 220 236 L 460 236" fill="none" stroke="#2f80ed" stroke-width="1.5"/>
  <text x="340" y="228" text-anchor="middle" font-size="10" fill="#2f80ed">SDA</text>

  <!-- 连线 SCL -->
  <path d="M 220 276 L 460 276" fill="none" stroke="#f2c94c" stroke-width="1.5"/>
  <text x="340" y="268" text-anchor="middle" font-size="10" fill="#f2c94c">SCL</text>

  <!-- 连线 IRQ -->
  <path d="M 220 316 L 460 316" fill="none" stroke="#e67e22" stroke-width="1.5"/>
  <text x="340" y="308" text-anchor="middle" font-size="10" fill="#e67e22">IRQ</text>

  <!-- 连线 RST -->
  <path d="M 220 356 L 460 356" fill="none" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="340" y="348" text-anchor="middle" font-size="10" fill="#e74c3c">RST (RSTPD_N)</text>

  <!-- 底部提示 -->
  <rect x="40" y="415" width="600" height="60" rx="6" fill="#0f1419" stroke="#2e3d52" stroke-width="0.5"/>
  <text x="340" y="434" text-anchor="middle" font-size="11" fill="#f2c94c">6 线：VCC · GND · SDA=GPIO16 · SCL=GPIO17 · IRQ=GPIO4 · RST=GPIO32</text>
  <text x="340" y="452" text-anchor="middle" font-size="11" fill="#e74c3c">固件需设 PIN_NFC_RST=32（config.h 默认 -1 = 未接，硬复位不生效）</text>
  <text x="340" y="470" text-anchor="middle" font-size="11" fill="#8b9aab">串口：nfcscan 读卡 → nfcsave &lt;UID&gt; 注册 → 刷卡即开关门</text>
</svg>
